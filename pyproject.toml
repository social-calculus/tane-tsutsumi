[project]
name = "tane-tsutsumi"
version = "1.0.0"
description = "Open printable Iwami seed wraps"
requires-python = ">=3.11"
dependencies = [
    "pillow>=11,<13",
    "playwright>=1.50,<2",
    "numpy>=2,<3",
    "opencv-python-headless>=4.10,<5",
    "segno>=1.6,<2",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pymupdf>=1.26,<2",
]
